services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veyro
      POSTGRES_USER: veyro
      POSTGRES_PASSWORD: veyro
    ports:
      - "5432:5432"
    volumes:
      - veyro-postgres-data:/var/lib/postgresql/data

volumes:
  veyro-postgres-data:
